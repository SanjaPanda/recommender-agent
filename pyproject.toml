[project]
name = "recommender-agent"
version = "0.1.0"
description = "Local-first apparel recommendation agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.2,<5",
    "fastapi>=0.115,<1",
    "langgraph>=0.2,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
image = [
    "pillow>=10,<13",
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[project.scripts]
recommender-embed-products = "rag.embed_text:main"
recommender-search = "rag.search:main"
recommender-embed-images = "rag.embed_images:main"
recommender-agent-chat = "agent.cli:main"
recommender-agent-api = "agent.api:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/rag"]

[tool.uv]
package = true
